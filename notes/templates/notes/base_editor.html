<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Editor</title>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
    
    <!-- Quill.js -->
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill-blot-formatter@1.0.5/dist/quill-blot-formatter.min.js"></script>
    
    <!-- KaTeX for math formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    {% load static %}
    <link rel="stylesheet" href="{% static 'notes/css/styles.css' %}?v={% now 'U' %}">
    
    <style>
        :root {
            --app-bg: #f8f9fa; /* Light gray background like Google Docs workspace */
            --border: #dadce0; /* Google Docs border color */
            --primary: #1a73e8; /* Google Docs blue */
            --primary-hover: #174ea6;
        }
        
        body {
            background-color: var(--app-bg);
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* The top bar matching Google Docs style */
        .doc-header {
            background: #ffffff;
            display: flex;
            align-items: center;
            padding: 8px 16px;
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .doc-back-btn {
            color: #5f6368;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: background 0.2s;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .doc-back-btn:hover {
            background: #f1f3f4;
        }

        .doc-title-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .doc-title-input {
            border: 1px solid transparent;
            font-size: 1.15rem;
            font-weight: 500;
            color: #202124;
            padding: 4px 8px;
            border-radius: 4px;
            width: 100%;
            max-width: 600px;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        .doc-title-input:hover {
            border-color: var(--border);
        }
        
        .doc-title-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
            background: #fff;
        }

        .doc-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-doc-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 24px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.95rem;
        }
        .btn-doc-primary:hover {
            background: var(--primary-hover);
        }

        /* Workspace area */
        .workspace {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 60px;
        }

        /* Formatting Toolbar overrides */
        .ql-toolbar.ql-snow {
            width: 100%;
            background: #edf2fa;
            border: none !important;
            border-bottom: 1px solid var(--border) !important;
            border-radius: 0 !important;
            padding: 8px 24px !important;
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            justify-content: center;
        }

        /* The Paper */
        .paper-container {
            width: 100%;
            max-width: 816px; /* 8.5 inches at 96dpi approx */
            min-height: 1056px; /* 11 inches at 96dpi approx */
            background: #fff;
            margin-top: 24px;
            box-shadow: 0 1px 3px 0 rgba(0,0,0,0.15);
            border: 1px solid var(--border);
            border-radius: 2px;
        }

        .ql-container.ql-snow {
            border: none !important;
        }

        .ql-editor {
            padding: 48px 64px !important; /* Margins of the paper */
            min-height: 1056px;
            font-size: 1.05rem;
            line-height: 1.6;
            color: #202124;
        }
        
        /* Remove base app container layout */
        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <div class="app-container" id="main-content">
        {% block editor_content %}
        {% endblock %}
    </div>
    
    <!-- Custom JS -->
    <script src="{% static 'notes/js/app.js' %}"></script>
</body>
</html>
