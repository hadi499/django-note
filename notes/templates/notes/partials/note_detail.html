<div class="doc-header">
    {% if note.folder %}
        <a href="{% url 'notes:folder_detail' note.folder.pk %}" class="doc-back-btn" title="Back to Folder">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </a>
    {% else %}
        <a href="{% url 'notes:index' %}" class="doc-back-btn" title="Back Home">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </a>
    {% endif %}
    
    <div class="doc-title-container">
        <div style="font-size: 1.15rem; font-weight: 500; color: #202124; padding: 4px 8px;">
            {{ note.title }}
        </div>
        <div style="font-size: 0.8rem; color: #5f6368; padding-left: 8px;">
            Last updated: {{ note.updated_at|date:"M d, Y, H:i" }}
        </div>
    </div>
    
    <div class="doc-actions">
        <a href="{% url 'notes:edit_note' note.pk %}" class="btn-doc-primary" style="text-decoration: none; padding: 8px 16px;">
            Edit
        </a>
        <form method="POST" action="{% url 'notes:delete_note' note.pk %}" style="margin: 0;" onsubmit="return confirm('Are you sure you want to delete this note?');">
            {% csrf_token %}
            <button type="submit" class="btn-doc-primary" style="background: #ea4335; padding: 8px 16px;">Delete</button>
        </form>
        <button type="button" class="btn-doc-primary" style="background: #f1f3f4; color: #3c4043; padding: 8px 16px;" onclick="window.print()">
            Print
        </button>
    </div>
</div>

<div class="workspace">
    <div class="paper-container">
        <div class="ql-editor" style="min-height: auto;">
            {{ note.content|safe }}
        </div>
    </div>
</div>

<script>
    if (typeof katex !== 'undefined') {
        document.querySelectorAll('.ql-formula').forEach(el => {
            let formula = el.getAttribute('data-value');
            if (formula) katex.render(formula, el, { throwOnError: false });
        });
        if (typeof renderMathInElement !== 'undefined') {
            document.querySelectorAll('.ql-editor').forEach(el => {
                renderMathInElement(el, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false},
                        {left: '\\(', right: '\\)', display: false},
                        {left: '\\[', right: '\\]', display: true}
                    ],
                    throwOnError: false
                });
            });
        }
    }
</script>
