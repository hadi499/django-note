<form id="note-form" method="POST" style="display: flex; flex-direction: column; height: 100%;"
      onsubmit="document.getElementById('content').value = quill ? quill.root.innerHTML : document.querySelector('.ql-editor').innerHTML"
      action="{% if note %}{% url 'notes:edit_note' note.pk %}{% elif folder %}{% url 'notes:create_note' folder.pk %}{% endif %}">
    {% csrf_token %}
    <div class="doc-header">
        {% if folder %}
            <a href="{% url 'notes:folder_detail' folder.pk %}" class="doc-back-btn" title="Back to Folder">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </a>
        {% elif note.folder %}
            <a href="{% url 'notes:folder_detail' note.folder.pk %}" class="doc-back-btn" title="Back to Folder">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </a>
        {% else %}
            <a href="{% url 'notes:index' %}" class="doc-back-btn" title="Back Home">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </a>
        {% endif %}
        
        <div class="doc-title-container">
            <input type="text" name="title" id="title" class="doc-title-input" placeholder="Untitled document" value="{{ note.title|default_if_none:'' }}" required>
        </div>
        
        <div class="doc-actions">
            <button type="submit" class="btn-doc-primary">Save Note</button>
        </div>
    </div>
    
    <div class="workspace">
        <input type="hidden" name="content" id="content">
        <div class="paper-container">
            <div id="editor" class="quill-editor">
                {{ note.content|default_if_none:''|safe }}
            </div>
        </div>
    </div>
</form>

<script>
    if (typeof initQuill === 'function') {
        initQuill();
    }
</script>
